<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El camino del fármaco</title>
<style>
:root{
  --bg:#fdf6ea;--surface:#ffffff;--ink:#1d3b57;--muted:#51677a;--line:#ecd9bd;
  --t:#1f8a8a;--t-ink:#ffffff;--o:#e8742a;--o-ink:#ffffff;--p:#5b2a86;--hl:#ffe45c;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10222f;--surface:#183446;--ink:#eaf3f7;--muted:#a3bccb;--line:#2d5368;
  --t:#43c2c2;--t-ink:#06282a;--o:#ff9a5c;--o-ink:#2d1303;--p:#c9a2ee;--hl:#ffe45c;}}
:root[data-theme="dark"]{
  --bg:#10222f;--surface:#183446;--ink:#eaf3f7;--muted:#a3bccb;--line:#2d5368;
  --t:#43c2c2;--t-ink:#06282a;--o:#ff9a5c;--o-ink:#2d1303;--p:#c9a2ee;--hl:#ffe45c;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.55;font-size:17px}
main{max-width:620px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .4em}
h1{font-size:1.9rem;text-align:center}
h2{font-size:1.4rem}
.sub{text-align:center;color:var(--muted);margin:0 0 1.2em}
.cols{display:grid;gap:14px;margin:14px 0}
button{font:inherit;cursor:pointer;border:2px solid transparent;border-radius:14px;padding:14px 16px;min-height:52px}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.rt{text-align:center;padding:18px 14px}
.rt b{display:block;font-size:1.2rem}
.rt small{display:block;opacity:.92}
.rt img{display:block;margin:0 auto 8px;width:100%;max-width:260px;max-height:230px;object-fit:contain;border-radius:10px;background:#fff}
.rt svg{display:block;margin:0 auto 8px;width:100%;max-width:240px;border-radius:10px;background:#fff}
.T{background:var(--t);color:var(--t-ink)}
.O{background:var(--o);color:var(--o-ink)}
.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.stepper{display:flex;gap:8px;justify-content:center;margin:0 0 14px}
.stepper i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:bold;background:var(--line);color:var(--muted)}
.stepper i.on{background:var(--c);color:var(--ci)}
.card{background:var(--surface);border:3px solid var(--c);border-radius:18px;overflow:hidden;margin-bottom:14px}
.card svg{display:block;width:100%;height:auto;background:#fff}
.card img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain;background:#fff}
.card .tx{padding:16px 18px 20px}
.card h2{color:var(--c)}
.card p{margin:.3em 0}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav button{flex:1;text-align:center}
.final{background:var(--surface);border:4px solid var(--p);border-radius:18px;padding:20px;margin-bottom:14px;text-align:center}
.final mark{background:var(--hl);color:#1d3b57;padding:0 3px}
.note{background:var(--surface);border-left:6px solid var(--o);padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:.95rem}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
